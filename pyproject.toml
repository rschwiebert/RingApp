[project]
name = "ringapp"
description = "Website app for the Database of Ring Theory"
version = "2.0.0"
authors = [
    { name = "Ryan Schwiebert", email = "databaseofringtheory@gmail.com" }
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.8.1",
    "boto3==1.42.33",
    "dj-database-url==0.5.0",
    "django==5.2.18",
    "django-mathfilters==0.4.0",
    "django-publications==1.2.0",
    "django-ratelimit==2.0.0",
    "gunicorn==23.0.0",
    "model-mommy==1.6.0",
    "mpmath==1.3.0",
    "pillow==13",
    "pytz==2021.3",
    "pyyaml==6.0.2",
    "six==1.17.0",
    "sqlparse==0.6.0",
    "sympy==1.12",
    "whitenoise==6.12.0",
    "dart-data",
    "requests>=2.33.0",
    "cryptography==50.0.0",
    "pyopenssl==26.4.0",
    "wheel==0.46.2",
    "certifi==2026.10.18",
    "urllib3==2.8.0",
    "tzdata>=2024.2",
    "setuptools==84.1.0",
    "psycopg2==2.9.10",
]


[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ringapp", "moduleapp"]

[tool.uv.sources]
dart-data = { git = "https://github.com/rschwiebert/dart_data.git", rev = "2abf5d3335ae0120a1d9c18a6b73db46ec06cc44" }
django-publications = { git = "https://github.com/rschwiebert/django-publications", rev = "develop" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pexpect>=4.9.0",
]
